steps:
  # 1. Build the container image using build arguments for Next.js inlining
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/silkroad-africa'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '--build-arg'
      - 'NEXT_DEPLOYMENT_ID=$BUILD_ID'
      - '.'

  # 2. Push the built image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/silkroad-africa']

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'silkroad-africa'
      - '--image'
      - 'gcr.io/$PROJECT_ID/silkroad-africa'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # --update-env-vars merges with vars set directly on the service
      # (CRON_SECRET, ANTHROPIC_API_KEY, MAIL_PW_*, RESEND_API_KEY, ...);
      # --set-env-vars would wipe them on every deploy.
      - '--update-env-vars'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},NEXT_PUBLIC_APP_URL=https://silkroad-africa-798904783325.asia-east1.run.app,NEXT_PUBLIC_APP_NAME="SilkRoad Africa"'
      # Pulled directly from Secret Manager at runtime by Cloud Run itself —
      # never passed through Cloud Build substitutions or logs.
      - '--update-secrets'
      - 'SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest'

images:
  - 'gcr.io/$PROJECT_ID/silkroad-africa'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_APP_URL: ""
